<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar | Viola Thinking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/login.css">
</head>
<body class="tela-login">

  <div class="silhueta-viola" aria-hidden="true"></div>
  <span class="bokeh" style="width:120px;height:120px;top:12%;left:8%;"></span>
  <span class="bokeh" style="width:70px;height:70px;top:65%;left:18%;animation-delay:2s;"></span>
  <span class="bokeh" style="width:90px;height:90px;top:20%;left:82%;animation-delay:4s;"></span>
  <span class="bokeh" style="width:50px;height:50px;top:75%;left:88%;animation-delay:1s;"></span>

  <main class="cartao-login vidro">
    <img src="assets/img/logo.svg" alt="Viola Thinking" class="logo-login">
    <p class="subtitulo">Portal do Aluno — afine sua jornada musical</p>

    <div class="abas" role="tablist">
      <button class="aba ativa" data-aba="entrar" role="tab" aria-selected="true">Entrar</button>
      <button class="aba" data-aba="matricular" role="tab" aria-selected="false">Matricular-se</button>
    </div>

    <!-- ENTRAR -->
    <form id="form-login" class="painel-aba" data-painel="entrar">
      <div class="mensagem-erro" id="erro-login"></div>
      <div class="campo">
        <label for="login-email">E-mail</label>
        <input type="email" id="login-email" placeholder="voce@exemplo.com" required autocomplete="email">
      </div>
      <div class="campo">
        <label for="login-senha">Senha</label>
        <input type="password" id="login-senha" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="botao botao-dourado botao-full" id="btn-login">[ SINTONIZAR ]</button>
    </form>

    <!-- MATRICULAR -->
    <form id="form-matricula" class="painel-aba oculto" data-painel="matricular">
      <div class="mensagem-erro" id="erro-matricula"></div>
      <div class="mensagem-sucesso" id="sucesso-matricula"></div>
      <div class="campo">
        <label for="mat-nome">Nome completo</label>
        <input type="text" id="mat-nome" placeholder="Seu nome" required autocomplete="name">
      </div>
      <div class="campo">
        <label for="mat-email">E-mail</label>
        <input type="email" id="mat-email" placeholder="voce@exemplo.com" required autocomplete="email">
      </div>
      <div class="campo">
        <label for="mat-senha">Senha</label>
        <input type="password" id="mat-senha" placeholder="Mínimo 6 caracteres" minlength="6" required autocomplete="new-password">
      </div>
      <div class="campo">
        <label for="mat-instrumento">Instrumento</label>
        <select id="mat-instrumento">
          <option value="violao">Violão</option>
          <option value="guitarra">Guitarra</option>
        </select>
      </div>
      <div class="campo">
        <label for="mat-nivel">Nível atual</label>
        <select id="mat-nivel">
          <option value="Iniciante">Iniciante</option>
          <option value="Intermediário">Intermediário</option>
          <option value="Avançado">Avançado</option>
        </select>
      </div>
      <button type="submit" class="botao botao-dourado botao-full" id="btn-matricula">[ INICIAR MATRÍCULA ]</button>
    </form>

    <a href="login-professor.html" class="link-backstage">É professor? Acesse o Backstage →</a>
  </main>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script>
  // Alternância de abas
  document.querySelectorAll('.aba').forEach((aba) => {
    aba.addEventListener('click', () => {
      document.querySelectorAll('.aba').forEach((a) => { a.classList.remove('ativa'); a.setAttribute('aria-selected', 'false'); });
      aba.classList.add('ativa'); aba.setAttribute('aria-selected', 'true');
      const alvo = aba.dataset.aba;
      document.querySelectorAll('.painel-aba').forEach((p) => p.classList.toggle('oculto', p.dataset.painel !== alvo));
    });
  });

  // Login
  document.getElementById('form-login').addEventListener('submit', async (evento) => {
    evento.preventDefault();
    ocultarMensagens('#erro-login');
    const botao = document.getElementById('btn-login');
    const email = document.getElementById('login-email').value.trim();
    const senha = document.getElementById('login-senha').value;

    botao.disabled = true; botao.textContent = 'Sintonizando...';
    try {
      await ViolaAPI.login(email, senha);
      window.location.href = 'dashboard-aluno.html';
    } catch (erro) {
      exibirMensagem('#erro-login', erro.message);
    } finally {
      botao.disabled = false; botao.textContent = '[ SINTONIZAR ]';
    }
  });

  // Matrícula
  document.getElementById('form-matricula').addEventListener('submit', async (evento) => {
    evento.preventDefault();
    ocultarMensagens('#erro-matricula', '#sucesso-matricula');
    const botao = document.getElementById('btn-matricula');
    const payload = {
      nome: document.getElementById('mat-nome').value.trim(),
      email: document.getElementById('mat-email').value.trim(),
      senha: document.getElementById('mat-senha').value,
      instrumento: document.getElementById('mat-instrumento').value,
      nivel: document.getElementById('mat-nivel').value,
    };

    botao.disabled = true; botao.textContent = 'Matriculando...';
    try {
      const resposta = await ViolaAPI.registrarAluno(payload);
      if (resposta.access_token) {
        exibirMensagem('#sucesso-matricula', 'Matrícula realizada! Bem-vindo(a) à Viola Thinking.', 'sucesso');
        setTimeout(() => { window.location.href = 'dashboard-aluno.html'; }, 900);
      } else {
        exibirMensagem('#sucesso-matricula', 'Quase lá! Confirme seu e-mail para ativar sua matrícula.', 'sucesso');
      }
    } catch (erro) {
      exibirMensagem('#erro-matricula', erro.message);
    } finally {
      botao.disabled = false; botao.textContent = '[ INICIAR MATRÍCULA ]';
    }
  });
</script>
</body>
</html>
